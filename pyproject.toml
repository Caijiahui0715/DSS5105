[project]
name = "dss5105"
version = "0.1.0"
description = "NUS rental decision agent: data pipeline, recommendation backend and web demo"
readme = "README.md"
authors = [
    { name = "DSS5105 project team" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dss5105 = "dss5105:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
